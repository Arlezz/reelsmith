# CI de Reelsmith: en cada push y pull request.
#   estilo:  ruff (estándar de CENIA) sobre los scripts de Python
#   nativa:  instala las mismas versiones que la máquina de prueba y corre la prueba completa con jueces;
#            compara los md5 con bench/referencia-md5.json (si difieren, deja una advertencia, no falla)
#   imagen:  construye el Dockerfile, que corre la prueba completa adentro; en main la publica en
#            ghcr.io/<dueño>/reelsmith con las etiquetas latest y la versión de package.json
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estilo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .

  nativa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ffmpeg 6.1 de Ubuntu 24.04
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: paquetes de Python
        run: python -m pip install -r skills/reelsmith/scripts/requirements.txt
      - name: navegador del render (Chromium 1194)
        run: npx -y playwright@1.56.0 install --with-deps chromium-headless-shell
      - run: node skills/reelsmith/scripts/reelsmith.mjs doctor
      - name: prueba completa
        run: node skills/reelsmith/scripts/reelsmith.mjs prueba "$RUNNER_TEMP/prueba"
      - name: md5 contra la máquina de prueba
        run: node bench/comparar-md5.mjs "$RUNNER_TEMP/prueba"
      - name: guardar lo producido si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-nativa
          path: |
            ${{ runner.temp }}/prueba/**/*.log
            ${{ runner.temp }}/prueba/**/*.json
            ${{ runner.temp }}/prueba/**/*.png
          if-no-files-found: ignore

  imagen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: nombre y versión de la imagen
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reelsmith" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: construir (corre la prueba completa adentro) y, en main, publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
